# This is a TOML-format configuration file that contains all the input parameters of measures.
# The disadvantage of a toml configuration file is that: when you have too many parameters.
# Sometimes it becomes pretty hard to index the parameter like this toml file.

title = "static form for measure"

# choice = 0 means no measure, choice = 1 means there is measure
choice = 1 

# Else if choice = 1, there is measure. And Areas are below.

pr_meas_area = 0
cp_meas_area = 0
op_meas_area = 13.935456
up_meas_area = 0
uz_meas_area = 0
gw_meas_area = 0
swds_meas_area = 0
mss_meas_area = 0
ow_meas_area = 0

# predefined measure area [m^2]
meas_area = 13.935456

# runoff_to_stor_layer --- [1 or 3]: predefined selection at which measure layer runoff from other areas is stored (1 or 3)
# Inflow from other areas can only take place at interception level (1) or at the bottom storage level (3).
runoff_to_stor_layer = 1

# predefined interception storage on the measure at t=0 [mm]
intstor_meas_t0 = 0

# evaporation --- [1 or 0]: predefined selection if evaporation from measure is possible (1) or not (0).
ev_evaporation = 1

# num_stor_lvl --- [1, 2 or 3]: predefined number of storage levels (1, 2 or 3).
num_stor_lvl = 3

# infil_cap_meas --- predefined infiltration capacity of measure [mm/d]
infil_cap_meas = 4800

# top_storcap_meas --- predefined storage capacity in top layer of measure [mm]
top_storcap_meas = 76.2

# bot_storcap_meas --- predefined storage capacity in top layer of measure [mm]
bot_storcap_meas = 182.88

# top_stor_meas_t0 --- top layer storage at t=0 [mm]
top_stor_meas_t0 = 0

# bot_stor_meas_t0 --- bottom layer storage at t=0 [mm]
bot_stor_meas_t0 = 0

# int_cap_meas --- predefined interception storage capacity of measure [mm]
int_cap_meas = 20

# ts_area_meas --- predefined area of top layer storage area of measure [m2]
ts_area_meas = 13.935456

# et_transpiration --- [0 or 1]: predefined selection if transpiration from measure is possible (1) or not (0)
et_transpiration = 1

# e_frac_meas --- predefined evaporation factor of measure [-]
e_frac_meas = 0.8982

# in_infiltration --- [0 or 1]: predefined selection if infiltration from measure is possible (1) or not (0)
in_infiltration = 1

# tinf_cap_meas --- predefined infiltration capacity of top layer of measure [mm/d]
tinf_cap_meas = 480

# bs_area_meas --- predefined area of bottom layer storage area of measure [m^2]
bs_area_meas = 13.935456

# btm_et_transpiration --- [0 or 1]: predefined selection if transpiration from bottom layer of measure is possible (1) or not (0)
btm_et_transpiration = 1

# connection_to_gw --- [0 or 1]: predefined percolation (connection) from measure to groundwater is possible (1) or not (0)
# Button_CL17 is the same as Button_BW18
connection_to_gw = 1

# gwl_limit_meas --- predefined limitation of percolation from measure to groundwater if groundwater level is below measure bottom level
gwl_limit_meas = 1

# k_sat_uz --- predefined saturation permeability [mm/d] (this should be put into static_base.ini)
k_sat_uz = 67.9

# b_level_meas --- predefined bottom level of measure [m-SL]
b_level_meas = 0.6858

# btm_discharge_type --- [0 or 1]: predefined definition of discharge type from bottom layer of measure (0=down_seepage_flux limited, 1= level difference over resistance)
btm_discharge_type = 1
 
# br_cap_meas --- predefined runoff capacity from bottom layer of measure [mm/d]
br_cap_meas = 15

# bdl_meas --- predefined discharge level from bottom layer of measure [mm]
bdl_meas = 5

# bdr_meas --- predefined hydraulic resistance for level induced discharge from bottom layer of measure [d]
bdr_meas = 2

# all buttons:

# surf_runoff_meas_ow --- [0 or 1]: predefined definition of surface runoff from measure interception level to open water (0 = no, 1 = yes)
# ctrl_runoff_meas_ow --- [0 or 1]: predefined definition of controlled runoff from measure bottom level to open water (0 = no, 1 = yes)
# overflow_meas_ow --- [0 or 1]: predefined definition of overflow from measure bottom level to open water (0 = no, 1 = yes)
# surf_runoff_meas_uz --- [0 or 1]: predefined definition of surface runoff from measure to unsaturated zone (0 = no, 1 = yes)
# ctrl_runoff_meas_uz --- [0 or 1]: predefined definition of controlled runoff from measure to unsaturated zone (0 = no, 1 = yes)
# overflow_meas_uz --- [0 or 1]: predefined definition of overflow from measure to unsaturated zone (0 = no, 1 = yes)
# surf_runoff_meas_gw --- [0 or 1]: predefined definition of surface runoff from measure to groundwater (0 = no, 1 = yes)
# ctrl_runoff_meas_gw --- [0 or 1]: predefined definition of controlled runoff from measure to groundwater (0 = no, 1 = yes)
# overflow_meas_gw --- [0 or 1]: predefined definition of overflow from measure to groundwater (0 = no, 1 = yes)
# surf_runoff_meas_swds --- [0 or 1]: predefined definition of surface runoff from measure to storm water drainage system (0 = no, 1 = yes)
# ctrl_runoff_meas_swds --- [0 or 1]: predefined definition of controlled runoff from measure to storm water drainage system (0 = no, 1 = yes)
# overflow_meas_swds --- [0 or 1]: predefined definition of overflow from measure to storm water drainage system (0 = no, 1 = yes)
# surf_runoff_meas_mss --- [0 or 1]: predefined definition of surface runoff from measure to mixed sewer system (0 = no, 1 = yes)
# ctrl_runoff_meas_mss --- [0 or 1]: predefined definition of controlled runoff from measure to mixed sewer system (0 = no, 1 = yes)
# overflow_meas_mss --- [0 or 1]: predefined definition of overflow from measure to mixed sewer system (0 = no, 1 = yes)
# surf_runoff_meas_out --- predefined definition of surface runoff from measure to outside water (0 = no, 1 = yes)
# ctrl_runoff_meas_out --- predefined definition of controlled runoff from measure to outside water (0 = no, 1 = yes)
# overflow_meas_out --- predefined definition of overflow from measure to outside water (0 = no, 1 = yes)

surf_runoff_meas_ow = 0
ctrl_runoff_meas_ow = 0
overflow_meas_ow = 0

surf_runoff_meas_uz = 0
ctrl_runoff_meas_uz = 0
overflow_meas_uz= 0

surf_runoff_meas_gw = 0
ctrl_runoff_meas_gw = 1
overflow_meas_gw = 0

surf_runoff_meas_swds = 1
ctrl_runoff_meas_swds = 0
overflow_meas_swds = 1

surf_runoff_meas_mss = 0
ctrl_runoff_meas_mss = 0
overflow_meas_mss = 0

surf_runoff_meas_out = 0
ctrl_runoff_meas_out = 0
overflow_meas_out = 0


