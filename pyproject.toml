[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanwb"
version = "0.2.0"
description = "Urban Water Balance"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Wenxing Zhang", email = "w.x.zhang93@gmail.com" }]
license = { text = "MIT" }
keywords = ["urban", "water", "balance", "modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "pandas",
    "toml",
    "openpyxl",
    "fire",
    "tqdm",
    "matplotlib",
    "tabulate",
    "setuptools",
]

[project.optional-dependencies]
dev = ["black", "pytest", "pytest-cov", "sphinx", "sphinx_rtd_theme"]

[project.urls]
Homepage = "https://gitlab.com/deltares/urban/urbanwb"

[tool.setuptools]
packages = ["urbanwb"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["data/*.csv"]
